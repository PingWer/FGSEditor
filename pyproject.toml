[project]
name = "FGSEditor"
version = "5.1.1"
description = "Film Grain Table Editor"
requires-python = ">=3.12"
license = "AGPL-3.0"
dependencies = [
    "PySide6",
    "matplotlib",
    "numpy",
]

[project.scripts]
fgseditor = "fgseditor_qt.fgsview_loader:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fgseditor_qt*"]

[tool.pyright]
typeCheckingMode = "off"
exclude = ["typings"]
